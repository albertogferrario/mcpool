[project]
name = "mcpool"
version = "0.1.0"
description = "Share, adopt and upgrade the local MCP servers of Claude Code and Codex"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alberto Giancarlo Ferrario" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "claude-code", "codex", "serena"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = [
    "mcp>=1.20",
    "mcp-proxy>=0.10",
    "anyio>=4",
]

[project.urls]
Repository = "https://github.com/albertogferrario/mcpool"

[project.scripts]
mcpool = "mcpool.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
